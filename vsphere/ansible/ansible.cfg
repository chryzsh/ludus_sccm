[defaults]
inventory = ./inventory.yml
host_key_checking = False
retry_files_enabled = False
forks = 15
timeout = 60
stdout_callback = yaml

# Ansible looks for collections at ~/.ansible/collections/ansible_collections/<ns>/<name>/.
# Install this repo's collection there via `ansible-galaxy collection install`
# or a symlink (see README). ansible-galaxy install from a tarball also works.

[ssh_connection]
pipelining = True
