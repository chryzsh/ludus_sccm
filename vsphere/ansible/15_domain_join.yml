---
# Phase 15 — join every non-DC VM to the domain.
#
# The DC's IP is already the DNS server per terraform's guest
# customization (dns_server var), so name resolution against
# mayyhem.com should already work. The domain admin credential from
# group_vars/all/local.yml is used for the join.
#
# Runs in serial=1 by default (`serial: 5` here to bound simultaneous
# joins if the DC's replication is slow) with a reboot after join. Each
# join creates a marker at C:\domain_joined.marker so re-running skips
# hosts already in the domain.
#
# ps1-dev is not automatically excluded — if it's still broken, use
# --limit '!ps1-dev'.

- name: Domain join non-DC VMs
  hosts: all:!dc
  gather_facts: false
  serial: 5
  tasks:
    - name: Query current domain membership
      ansible.windows.win_powershell:
        script: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $Ansible.Result = @{
            in_domain = $cs.PartOfDomain
            domain    = $cs.Domain
          }
      register: domain_state

    - name: Join domain
      microsoft.ad.membership:
        dns_domain_name: "{{ ludus_domain_fqdn }}"
        domain_admin_user: "{{ ludus_domain_netbios_name }}\\{{ defaults.ad_domain_admin }}"
        domain_admin_password: "{{ defaults.ad_domain_admin_password }}"
        hostname: "{{ inventory_hostname }}"
        state: domain
        reboot: true
      when: not domain_state.result.in_domain

    - name: Mark as joined
      ansible.windows.win_copy:
        content: "Joined {{ ludus_domain_fqdn }} at {{ ansible_date_time.iso8601 | default('unknown') }}"
        dest: "C:\\domain_joined.marker"
      when: not domain_state.result.in_domain
