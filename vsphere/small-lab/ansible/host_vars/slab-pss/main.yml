---
# slab-pss: the standalone SCCM primary site server.
#
# All site-system roles (MP, DP, SMS Provider) are colocated on this
# host. SQL is on slab-db. No hierarchy (no CAS, no secondary, no
# passive). Use `StandaloneSiteConfigMgrSetup.ini.j2` — the collection's
# prep_siteserver default already picks this template when
# ludus_sccm_win_sccm_config_default_template isn't overridden.

ludus_sccm_sitecode: SLB
ludus_sccm_sitename: Slab Primary Site
ludus_sccm_site_server_hostname: 'slab-pss'
ludus_sccm_sql_server_hostname: 'slab-db'

# Colocated site systems — all point at slab-pss so the standalone
# install wires MP, DP, and SMS provider onto the site server itself.
# This is what the role defaults do too (they inherit from
# inventory_hostname), so these are belt-and-braces.
ludus_sccm_mgmt_server_hostname: 'slab-pss'
ludus_sccm_distro_server_hostname: 'slab-pss'
ludus_sccm_sms_provider_hostname: 'slab-pss'

# No hierarchy — leave parent-site settings empty.
ludus_sccm_parent_sitecode: ''
ludus_sccm_parent_site_server_hostname: ''

# No passive, no secondary.
ludus_sccm_passive_hostname: ''
ludus_sccm_secondary_sitecode: ''

# Kill PXE on this single-DP lab. Avoids becoming a rogue PXE responder
# on the shared subnet that hosts mayyhem's PS1-DP.
ludus_sccm_enable_pxe: false

# Give the installer plenty of headroom before the stall detector kills
# setup — matches mayyhem's PS1 setting.
ludus_sccm_install_stall_timeout_minutes: 30
