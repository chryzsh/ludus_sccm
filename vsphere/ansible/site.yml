---
# Ordered bring-up of the Mayyhem SCCM lab.
#
# Split into numbered phase files so each phase can be run and verified
# in isolation. Skip a phase by commenting its import_playbook line.
# Run a single phase directly: ./run.sh NN_phase.yml
#
# The Mayyhem collection assumes Ludus platform pre-work: the DC is
# already promoted, `domainadmin` already exists, non-DC VMs already
# joined to the domain. Phases 05 and 15 replicate that pre-work here.

- import_playbook: 00_connectivity.yml       # win_ping every host
- import_playbook: 05_ad_forest.yml          # promote DC + create domainadmin
- import_playbook: 10_windows_base.yml       # windows_base on every host
- import_playbook: 15_domain_join.yml        # join non-DC hosts to the domain
- import_playbook: 20_install_adcs.yml       # install ADCS on the DC
- import_playbook: 30_prep_site_systems.yml  # prep_dp, prep_mp, prep_sms,
                                             # prep_siteserver ×2, contentlib
- import_playbook: 35_admin_plumbing.yml     # add_pss_to_admins + accounts
- import_playbook: 40_install_databases.yml  # SQL on cas-db + ps1-db
- import_playbook: 50_install_ps1.yml        # install PS1 (standalone install)
                                             # + SMS, passive, secondary
- import_playbook: 55_prep_cas_extension.yml # copy PS1's CD.Latest onto cas-pss
- import_playbook: 60_extend_to_cas.yml      # cas-pss extends ps1-pss to add CAS
- import_playbook: 70_verify.yml             # SQL + CM DB + hierarchy + boundary group
