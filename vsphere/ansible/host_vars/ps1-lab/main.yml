---
# ps1-lab is a workshop RDP host: Server 2022, joined to mayyhem.com,
# enrolled as a PS1 client via the same client-push machinery that
# handles ps1-dev. Sized in terraform for ~10 concurrent RDP sessions
# (see locals.tf).

# Site membership — same as every other PS1-tier host, so client push
# picks it up.
ludus_sccm_site_server_hostname: 'ps1-pss'

# Override create_demo_users' 2-user default: student accounts, all
# local admin (workshop simplicity — no helpdesk vs. domainuser split),
# all in Remote Desktop Users so they can RDP.
#
# The 2026-09-17 workshop ran with student01-12. Wound down 2026-09-18:
# student04-12 (VMs, AD accounts, local-admin) removed, leaving
# student01-03 for follow-up. Trimmed this list to match so a future
# provisioning run won't recreate the removed accounts. To run another
# full workshop, re-extend to the student count you need.
ludus_sccm_demo_users:
  - { username: student01, password: 'Password123', local_admin: true }
  - { username: student02, password: 'Password123', local_admin: true }
  - { username: student03, password: 'Password123', local_admin: true }
