---
# Phase 10 — run windows_base on every VM.
#
# windows_base does: enable Windows Update service, disable firewall on
# all profiles, disable Defender real-time protection, set auto-logon to
# the domain admin, install WebDAV (server VMs), enable WebClient service.
#
# Auto-logon uses SLAB\domainadmin which is created in phase 05. If 05
# hasn't run, auto-logon fails silently (no functional impact). Rest of
# windows_base is domain-independent.

- name: windows_base on all VMs
  hosts: all
  # gather_facts on: windows_base's completion-marker task uses
  # {{ ansible_date_time.iso8601 }}, which is only set when facts are gathered.
  gather_facts: true
  roles:
    - role: mayyhem.ludus_sccm.windows_base
