---
# Phase 5 — create the AD forest and the domain admin user.
#
# After this play:
#   - slab-dc is promoted, forest {{ ludus_domain_fqdn }} (slab.lab) exists.
#   - `SLAB\domainadmin` exists with defaults.ad_domain_admin_password.
#     In Domain Admins, Enterprise Admins, Schema Admins (Enterprise
#     Admin is required by install_adcs for an Enterprise Root CA).
#   - OUs Workstations and Servers exist under the domain DN.
#   - `domainjoin` user exists (referenced by add_os_task_sequence).
#
# WinRM auth switches from local Administrator to SLAB\Administrator
# post-promotion. Password does not change, so ansible_password keeps
# working without an inventory rewrite.

- name: Promote slab-dc and create domain admin
  hosts: slab-dc
  gather_facts: false
  vars:
    dsrm_password: "{{ ansible_password }}"  # reuse local admin password for DSRM
  tasks:
    - name: Query current domain membership
      ansible.windows.win_powershell:
        script: |
          $Ansible.Result = @{
            in_domain = (Get-CimInstance Win32_ComputerSystem).PartOfDomain
            domain    = (Get-CimInstance Win32_ComputerSystem).Domain
          }
      register: domain_state

    - name: Create AD forest
      microsoft.ad.domain:
        dns_domain_name: "{{ ludus_domain_fqdn }}"
        domain_netbios_name: "{{ ludus_domain_netbios_name }}"
        safe_mode_password: "{{ dsrm_password }}"
        install_dns: true
        reboot: true
      when: not domain_state.result.in_domain

    - name: Wait for WinRM to come back after promotion + reboot
      ansible.builtin.wait_for:
        host: "{{ hostvars['slab-dc'].ansible_host }}"
        port: 5985
        timeout: 300
        state: started
      delegate_to: localhost
      when: not domain_state.result.in_domain

    # ADWS (9389) starts a bit after WinRM on a freshly-promoted DC.
    # Wait locally on the DC before creating users (checking externally
    # doesn't work — Windows Firewall is still on until windows_base
    # runs in phase 10, which blocks 9389).
    - name: Wait for ADWS to be listening locally on slab-dc
      ansible.windows.win_wait_for:
        host: 127.0.0.1
        port: 9389
        timeout: 300
        state: started

    - name: Create domain admin user
      microsoft.ad.user:
        name: "{{ defaults.ad_domain_admin }}"
        password: "{{ defaults.ad_domain_admin_password }}"
        password_never_expires: true
        state: present
        groups:
          set:
            - Domain Admins
            - Enterprise Admins
            - Schema Admins
        path: "CN=Users,DC={{ ludus_domain_fqdn.split('.') | join(',DC=') }}"
      register: dom_user
      until: dom_user is succeeded
      retries: 10
      delay: 30

    # OUs the collection expects (force_gpupdate searches OU=Servers +
    # OU=Workstations; add_os_task_sequence writes to LDAP://OU=Workstations,...).
    - name: Ensure OU=Workstations
      microsoft.ad.ou:
        name: Workstations
        path: "DC={{ ludus_domain_fqdn.split('.') | join(',DC=') }}"
        state: present

    - name: Ensure OU=Servers
      microsoft.ad.ou:
        name: Servers
        path: "DC={{ ludus_domain_fqdn.split('.') | join(',DC=') }}"
        state: present

    - name: Create domain-join user (referenced by add_os_task_sequence)
      microsoft.ad.user:
        name: "{{ ludus_domain_join_account | default('domainjoin') }}"
        password: "{{ ludus_domain_join_password | default('Password123') }}"
        password_never_expires: true
        state: present
        groups:
          add:
            - Domain Users
