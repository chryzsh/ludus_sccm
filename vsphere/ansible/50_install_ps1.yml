---
# Phase 50 — install SCCM on PS1.
#
# install_primary_site on ps1-pss:
#   Extends AD schema (extadsch.exe), runs unattended setup.exe (with
#   ChildSiteConfigMgrSetup.ini.j2 per host_vars — but CAS doesn't
#   exist yet so setup degrades to a standalone install). Then runs
#   cm_accounts / config_naa / client_push / discovery_methods /
#   config_pxe.yaml. Includes retry-on-stall logic (3 attempts with
#   reboot between).
#
# install_sms on ps1-sms:
#   Remote SMS provider install: setup.exe /SDKINST <fqdn>.
#
# install_passive_site_server on ps1-psv:
#   Adds passive site server via scheduled task.
#
# install_secondary_site on ps1-pss:
#   Schedules New-CMSecondarySite on ps1-pss targeting ps1-sec.
#
# ps1-lib content library setup happens implicitly via prep +
# create_contentlib_share in phase 30. install_primary_site's
# move-content-library step targets ps1-lib.
#
# These are sequenced (site install first, then everything that needs
# a working primary).

- name: install_primary_site on ps1-pss (standalone install; CAS extends later)
  hosts: ps1-pss
  gather_facts: false
  vars:
    # The collection's install_primary_site defaults ship three weak
    # passwords ("password") that don't meet default AD complexity.
    # group_vars overrides were being shadowed by role-scope resolution
    # during loop expansion; play-level vars are a higher precedence tier
    # (priority 8 vs. group_vars priority 3) and take effect reliably.
    ludus_sccm_client_push_password: "Password123"
    ludus_sccm_task_sequence_password: "Password123"
    ludus_sccm_domain_join_password: "Password123"
  roles:
    - role: mayyhem.ludus_sccm.install_primary_site

- name: install_sms — runs on ps1-pss (has setup.exe), targets ps1-sms
  # install_sms invokes setup.exe /SDKINST from the site server itself,
  # targeting the remote SMS provider host by FQDN. new-config.yml lists
  # the role under ps1-pss's roles block (not ps1-sms). ps1-sms's own
  # host_vars still supply ludus_sccm_sms_provider_hostname for the
  # role's target argument.
  hosts: ps1-pss
  gather_facts: false
  vars:
    ludus_sccm_sms_provider_hostname: 'ps1-sms'
  roles:
    - role: mayyhem.ludus_sccm.install_sms

- name: install_passive_site_server — runs on ps1-pss, targets ps1-psv
  # Role uses ConfigurationManager.psd1 (only present on the site
  # server) to move the content library and add the passive site server
  # to the hierarchy. new-config.yml scopes it under ps1-pss's roles.
  hosts: ps1-pss
  gather_facts: false
  roles:
    - role: mayyhem.ludus_sccm.install_passive_site_server

- name: install_secondary_site (targets ps1-sec, driven from ps1-pss)
  hosts: ps1-pss
  gather_facts: false
  roles:
    - role: mayyhem.ludus_sccm.install_secondary_site
