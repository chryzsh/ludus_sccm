---
# Phase 15 — join slab-pss and slab-db to slab.lab.
#
# slab-dc's IP is already the DNS server per terraform's guest
# customization (dns_server=192.0.2.117), so name resolution against
# slab.lab works once slab-dc is promoted (phase 05).

- name: Domain join non-DC VMs
  hosts: all:!slab-dc
  gather_facts: false
  serial: 2
  tasks:
    - name: Query current domain membership
      ansible.windows.win_powershell:
        script: |
          $cs = Get-CimInstance Win32_ComputerSystem
          $Ansible.Result = @{
            in_domain = $cs.PartOfDomain
            domain    = $cs.Domain
          }
      register: domain_state

    - name: Join domain
      microsoft.ad.membership:
        dns_domain_name: "{{ ludus_domain_fqdn }}"
        domain_admin_user: "{{ ludus_domain_netbios_name }}\\{{ defaults.ad_domain_admin }}"
        domain_admin_password: "{{ defaults.ad_domain_admin_password }}"
        hostname: "{{ inventory_hostname }}"
        state: domain
        reboot: true
      when: not domain_state.result.in_domain

    - name: Mark as joined
      ansible.windows.win_copy:
        content: "Joined {{ ludus_domain_fqdn }} at {{ ansible_date_time.iso8601 | default('unknown') }}"
        dest: "C:\\domain_joined.marker"
      when: not domain_state.result.in_domain
