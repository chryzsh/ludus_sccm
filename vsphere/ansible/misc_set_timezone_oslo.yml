---
# Set all lab VMs to Oslo time.
#
# Why: the vSphere provider defaults Windows guest customization to
# TimeZone=85 (GMT Standard Time, London), so every fresh VM lands one
# hour behind Oslo in summer / on the same wall clock but wrong TZ ID
# in winter. Kerberos has a 5-minute skew tolerance in AD by default,
# scheduled tasks fire at the wrong wall-clock time, log correlation
# across the lab becomes a nightmare, and NTLM relay tests can fail
# on token freshness checks — subtle enough to eat a workshop hour
# hunting the wrong root cause.
#
# What: sets Windows hosts to `W. Europe Standard Time` (Oslo / Berlin /
# Amsterdam / Stockholm) and Ubuntu students to `Europe/Oslo`, then
# forces a time resync so the wall clock jumps immediately.
#
# Idempotent: skips when the target TZ is already set.
#
# Run against both labs (inventory is per-directory):
#   cd vsphere/ansible               && ./run.sh misc_set_timezone_oslo.yml
#   cd vsphere/small-lab/ansible     && ./run.sh /Users/chrisr/opt/ludus_sccm_mayyhem/vsphere/ansible/misc_set_timezone_oslo.yml
#
# The permanent fix is `time_zone = 110` in the Windows customize block
# of both vms.tf files — committed alongside this playbook.

- name: Set Windows VMs to W. Europe Standard Time (Oslo)
  hosts: all:!students_tier
  gather_facts: false
  tasks:
    - name: Get current timezone
      ansible.windows.win_powershell:
        script: |
          $tz = Get-TimeZone
          $Ansible.Result = @{ id = $tz.Id; display = $tz.DisplayName }
      register: tz_before
      changed_when: false

    - name: Set timezone to W. Europe Standard Time
      ansible.windows.win_powershell:
        script: |
          $target = "W. Europe Standard Time"
          if ((Get-TimeZone).Id -ne $target) {
            Set-TimeZone -Id $target
            $Ansible.Result = @{ changed = $true; new = (Get-TimeZone).DisplayName }
          } else {
            $Ansible.Result = @{ changed = $false }
          }
      register: tz_set
      changed_when: tz_set.result.changed | default(false) | bool

    - name: Force w32tm resync so wall clock jumps immediately
      ansible.windows.win_shell: |
        w32tm /resync /force 2>&1
        Write-Output "---now---"
        Get-Date -Format 'yyyy-MM-dd HH:mm:ss zzz'
      register: resync
      when: tz_set.result.changed | default(false) | bool
      changed_when: false

    - name: Show new state
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: was {{ tz_before.result.display }} -> now {{ (tz_set.result.new | default(tz_before.result.display)) }} {{ (resync.stdout_lines | default([]) | select('match', '^\\d') | list | last) if tz_set.result.changed | default(false) else '' }}"

- name: Set Ubuntu student VMs to Europe/Oslo
  hosts: students_tier
  gather_facts: false
  become: true
  # ansible_password from group_vars/all/local.yml is a WinRM password
  # and leaks into SSH — triggering sshpass demand. Clear it here so
  # the students_tier SSH connection uses key auth only.
  vars:
    ansible_password: ""
  tasks:
    - name: Set timezone
      community.general.timezone:
        name: Europe/Oslo
      register: tz_ubuntu

    - name: Show
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: timezone={{ tz_ubuntu.diff.after.name | default('Europe/Oslo') }} (changed={{ tz_ubuntu.changed }})"
